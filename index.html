<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi árbol de flores 🌸</title>

<style>

/* =========================================================
   🌸🌸🌸 PERSONALIZACIÓN VISUAL 🌸🌸🌸
   ========================================================= */

:root {

    /* 🎨 FONDO */
    --fondo-1: #FFC0CB;
    --fondo-2: #ffddea;

    /* 💗 COLOR DEL TEXTO */
    --color-titulo: #9b3f68;
    --color-texto: #704052;

    /* 🌳 ÁRBOL */
    --color-tronco: #70452f;
    --color-rama: #70452f;

    /* 🌱 SUELO */
    --color-suelo: #b97959;

    /* ✨ TAMAÑO GENERAL */
    --tamano-arbol: 1;

    /* 🌸 VELOCIDAD DE LAS FLORES */
    --duracion-flores: 2.5s;
}


/* =========================================================
   ⚙️ CONFIGURACIÓN GENERAL
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {

    overflow: hidden;

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.9),
            transparent 25%
        ),

        linear-gradient(
            135deg,
            var(--fondo-1),
            var(--fondo-2)
        );

    font-family: Georgia, serif;

    color: var(--color-texto);
}


/* =========================================================
   🌳 CONTENEDOR PRINCIPAL
   ========================================================= */

.pagina {

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 40px;

    padding: 30px;
}


/* =========================================================
   🌳 ZONA DEL ÁRBOL
   ========================================================= */

.zona-arbol {

    position: relative;

    width: min(55vw, 600px);

    height: min(75vh, 650px);

    transform:
        scale(var(--tamano-arbol));

    flex-shrink: 0;
}


/* =========================================================
   🌱 SUELO
   ========================================================= */

.suelo {

    position: absolute;

    bottom: 8%;

    left: 50%;

    transform:
        translateX(-50%);

    width: 65%;

    height: 12px;

    background:
        var(--color-suelo);

    border-radius: 50%;

    opacity: .7;
}


/* =========================================================
   🌳 TRONCO
   ========================================================= */

.tronco {

    position: absolute;

    bottom: 9%;

    left: 50%;

    transform:
        translateX(-50%);

    width: 55px;

    height: 46%;

    background:
        var(--color-tronco);

    border-radius:
        45% 45% 15% 15%;

    box-shadow:

        inset 8px 0
        rgba(255,255,255,.08),

        inset -8px 0
        rgba(0,0,0,.08);
}


/* =========================================================
   🌿 RAMAS
   ========================================================= */

.rama {

    position: absolute;

    height: 18px;

    background:
        var(--color-rama);

    border-radius: 20px;

    transform-origin:
        left center;
}


.rama-1 {

    width: 38%;

    left: 50%;

    bottom: 40%;

    transform:
        rotate(-35deg);
}


.rama-2 {

    width: 35%;

    right: 50%;

    bottom: 48%;

    transform-origin:
        right center;

    transform:
        rotate(35deg);
}


.rama-3 {

    width: 30%;

    left: 50%;

    bottom: 58%;

    transform:
        rotate(-55deg);
}


.rama-4 {

    width: 28%;

    right: 50%;

    bottom: 63%;

    transform-origin:
        right center;

    transform:
        rotate(55deg);
}


/* =========================================================
   🌸 FLORES Y 🖤 DEL ÁRBOL
   ========================================================= */

.flor {

    position: absolute;

    /*
       Con 250 elementos utilizamos un tamaño
       más pequeño para que puedan quedar
       separados.
    */

    font-size: 18px;

    line-height: 18px;

    width: 18px;

    height: 18px;

    display: flex;

    align-items: center;

    justify-content: center;

    opacity: 0;

    pointer-events: none;

    transform:

        translate(
            var(--inicio-x),
            var(--inicio-y)
        )

        scale(.2)

        rotate(180deg);

    animation:

        moverFlor

        var(--duracion-flores)

        cubic-bezier(.2,.8,.2,1)

        forwards;

    animation-delay:
        var(--delay);

    filter:

        drop-shadow(
            0 2px 2px
            rgba(0,0,0,.15)
        );
}


/* =========================================================
   ✨ ANIMACIÓN DE LAS FLORES
   ========================================================= */

@keyframes moverFlor {

    0% {

        opacity: 0;

        transform:

            translate(
                var(--inicio-x),
                var(--inicio-y)
            )

            scale(.2)

            rotate(180deg);
    }

    20% {

        opacity: 1;
    }

    100% {

        opacity: 1;

        transform:

            translate(0,0)

            scale(1)

            rotate(0deg);
    }
}


/* =========================================================
   💗 MENSAJE
   ========================================================= */

.mensaje {

    width:
        min(35vw, 420px);

    text-align:
        center;

    opacity: 0;

    animation:

        aparecerMensaje

        2s ease forwards;

    animation-delay:
        7s;
}


.mensaje h1 {

    margin:
        0 0 25px;

    font-size:
        clamp(32px, 5vw, 58px);

    color:
        var(--color-titulo);
}


.mensaje p {

    font-size:
        clamp(17px, 2vw, 23px);

    line-height:
        1.7;

    margin:
        14px 0;
}


@keyframes aparecerMensaje {

    from {

        opacity: 0;

        transform:
            translateY(30px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   ❤️ CORAZONES QUE FLOTAN POR EL FONDO
   ========================================================= */

.corazon {

    position: absolute;

    font-size: 22px;

    opacity: 0;

    animation:

        flotarCorazon

        6s

        linear

        infinite;
}


@keyframes flotarCorazon {

    0% {

        opacity: 0;

        transform:

            translateY(30px)

            scale(.7);
    }

    20% {

        opacity: .8;
    }

    100% {

        opacity: 0;

        transform:

            translateY(-100vh)

            scale(1.2);
    }
}


/* =========================================================
   📱 MÓVIL
   ========================================================= */

@media (max-width: 750px) {

    body {

        overflow: auto;
    }


    .pagina {

        min-height:
            100vh;

        height:
            auto;

        flex-direction:
            column;

        gap:
            0;

        padding-top:
            10px;
    }


    .zona-arbol {

        width:
            95vw;

        height:
            60vh;

        max-height:
            520px;
    }


    .flor {

        font-size:
            15px;

        width:
            15px;

        height:
            15px;

        line-height:
            15px;
    }


    .mensaje {

        width:
            90%;

        padding-bottom:
            30px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     🌳 ÁRBOL
     ===================================================== -->

<div class="pagina">


    <div class="zona-arbol">

        <div class="suelo"></div>

        <div class="tronco"></div>

        <div class="rama rama-1"></div>

        <div class="rama rama-2"></div>

        <div class="rama rama-3"></div>

        <div class="rama rama-4"></div>


        <!-- 🌸 AQUÍ APARECERÁN LAS FLORES Y 🖤 -->

        <div id="flores"></div>

    </div>


    <!-- =================================================
         💌 MENSAJE
         ================================================= -->

    <div class="mensaje">

        <h1 id="titulo"></h1>

        <div id="texto"></div>

    </div>

</div>


<script>


/* =========================================================
   🌸🌸🌸 PERSONALIZACIÓN 🌸🌸🌸
   ========================================================= */


/* =========================================================
   💗 TÍTULO
   ========================================================= */

const titulo = "Te amo";


/* =========================================================
   📝 TEXTO
   ========================================================= */

const mensajes = [

    "Queria tener un detalle contigo, ya lo sabias, aqui le tienes",

    "Por cada flor que ves es un te amo que te quiero decir.",

    "Desde el 17 de noviembre de 2023 y por siempre miniña, te amo"

];


/* =========================================================
   🌸 FLORES
   =========================================================

   ESTOS SON EXACTAMENTE LOS EMOJIS
   QUE YA TENÍAS.

   🖤 NO SE INCLUYE AQUÍ PORQUE
   LOS 50 CORAZONES SE CREAN APARTE.
   ========================================================= */

const floresDisponibles = [

    "🖤",
    "🖤",
    "🖤",
    "🖤",


];


/* =========================================================
   🌸 CANTIDAD DE FLORES
   ========================================================= */

const numeroDeFlores = 200;


/* =========================================================
   🖤 CANTIDAD DE CORAZONES NEGROS
   ========================================================= */

const numeroDeCorazonesNegros = 50;


/* =========================================================
   ✨ VELOCIDAD
   ========================================================= */

const velocidadFlores = 2.5;


/* =========================================================
   🌳 ELEMENTOS DEL ÁRBOL
   ========================================================= */

const zonaArbol =
    document.querySelector(
        ".zona-arbol"
    );


const contenedorFlores =
    document.getElementById(
        "flores"
    );


/* =========================================================
   📐 DISTANCIA ENTRE ELEMENTOS
   =========================================================

   El programa no permite colocar dos emojis
   demasiado cerca.

   Así evitamos que se superpongan.

   ========================================================= */

const distanciaMinima = 18;


/* =========================================================
   📍 POSICIONES YA UTILIZADAS
   ========================================================= */

const posicionesUsadas = [];


/* =========================================================
   ❤️ COMPROBAR SI UNA POSICIÓN ESTÁ LIBRE
   ========================================================= */

function posicionLibre(x, y) {

    for (
        const posicion
        of posicionesUsadas
    ) {

        const diferenciaX =
            x - posicion.x;


        const diferenciaY =
            y - posicion.y;


        const distancia =
            Math.sqrt(

                diferenciaX *
                diferenciaX

                +

                diferenciaY *
                diferenciaY

            );


        if (
            distancia <
            distanciaMinima
        ) {

            return false;
        }
    }


    return true;
}


/* =========================================================
   ❤️ FORMA DE CORAZÓN
   =========================================================

   Esta función determina si un punto
   pertenece a la silueta de un corazón.

   Así los 200 elementos + 50 🖤
   forman una COPA CON FORMA DE CORAZÓN.

   ========================================================= */

function estaDentroDelCorazon(
    x,
    y,
    centroX,
    centroY,
    radioX,
    radioY
) {

    const normalX =
        (x - centroX) /
        radioX;


    const normalY =
        (centroY - y) /
        radioY;


    /*
       Ecuación matemática de un corazón.
    */

    const valor =

        Math.pow(
            normalX,
            2
        )

        +

        Math.pow(
            normalY,
            2
        )

        - 1;


    const formaCorazon =

        Math.pow(
            valor,
            3
        )

        -

        Math.pow(
            normalX,
            2
        )

        *

        Math.pow(
            normalY,
            3
        );


    return (
        formaCorazon <= 0
    );
}


/* =========================================================
   🌳 GENERAR UNA POSICIÓN
   ========================================================= */

function generarPosicion() {

    const ancho =
        zonaArbol.clientWidth;


    const alto =
        zonaArbol.clientHeight;


    /*
       Centro de la copa.
    */

    const centroX =
        ancho / 2;


    const centroY =
        alto * 0.38;


    /*
       Tamaño de la copa.
    */

    const radioX =
        ancho * 0.45;


    const radioY =
        alto * 0.31;


    /*
       Intentamos encontrar
       una posición libre.
    */

    for (
        let intento = 0;
        intento < 3000;
        intento++
    ) {

        const x =

            Math.random() *
            ancho;


        const y =

            alto * 0.08

            +

            Math.random() *
            alto * 0.55;


        /*
           Comprobamos que esté
           dentro del corazón.
        */

        if (
            !estaDentroDelCorazon(
                x,
                y,
                centroX,
                centroY,
                radioX,
                radioY
            )
        ) {

            continue;
        }


        /*
           Comprobamos que no esté
           demasiado cerca de otro emoji.
        */

        if (
            !posicionLibre(x, y)
        ) {

            continue;
        }


        return {
            x: x,
            y: y
        };
    }


    /*
       Si después de muchos intentos
       no encuentra sitio, reducimos
       ligeramente la distancia para
       poder llenar toda la copa.
    */

    for (
        let intento = 0;
        intento < 3000;
        intento++
    ) {

        const x =

            Math.random() *
            ancho;


        const y =

            alto * 0.08

            +

            Math.random() *
            alto * 0.55;


        if (
            estaDentroDelCorazon(
                x,
                y,
                centroX,
                centroY,
                radioX,
                radioY
            )
        ) {

            return {
                x: x,
                y: y
            };
        }
    }


    return {

        x:
            ancho / 2,

        y:
            alto * .35

    };
}


/* =========================================================
   🌸 CREAR LAS 200 FLORES
   ========================================================= */

for (
    let i = 0;
    i < numeroDeFlores;
    i++
) {

    const flor =
        document.createElement(
            "div"
        );


    flor.className =
        "flor";


    /*
       Elegimos aleatoriamente
       uno de tus cinco emojis.
    */

    flor.textContent =

        floresDisponibles[
            Math.floor(

                Math.random() *

                floresDisponibles.length

            )
        ];


    /*
       Generamos una posición
       libre dentro del corazón.
    */

    const posicion =
        generarPosicion();


    posicionesUsadas.push(
        posicion
    );


    flor.style.left =
        posicion.x + "px";


    flor.style.top =
        posicion.y + "px";


    /*
       Punto de partida aleatorio.
    */

    const inicioX =

        (
            Math.random() *
            1000
            -
            500
        )
        + "px";


    const inicioY =

        (
            Math.random() *
            800
            -
            400
        )
        + "px";


    flor.style.setProperty(
        "--inicio-x",
        inicioX
    );


    flor.style.setProperty(
        "--inicio-y",
        inicioY
    );


    /*
       Aparición progresiva.
    */

    const delay =

        (
            Math.random() *
            5
        )
        + "s";


    flor.style.setProperty(
        "--delay",
        delay
    );


    flor.style.setProperty(
        "--duracion-flores",
        velocidadFlores + "s"
    );


    contenedorFlores.appendChild(
        flor
    );
}


/* =========================================================
   🖤 CREAR LOS 50 CORAZONES NEGROS
   =========================================================

   Los corazones negros utilizan
   posiciones completamente independientes
   de las flores.

   Por eso NO se superponen.

   ========================================================= */

for (
    let i = 0;
    i < numeroDeCorazonesNegros;
    i++
) {

    const corazon =
        document.createElement(
            "div"
        );


    corazon.className =
        "flor";


    corazon.textContent =
        "🖤";


    /*
       Nueva posición libre.
    */

    const posicion =
        generarPosicion();


    posicionesUsadas.push(
        posicion
    );


    corazon.style.left =
        posicion.x + "px";


    corazon.style.top =
        posicion.y + "px";


    /*
       Movimiento inicial.
    */

    const inicioX =

        (
            Math.random() *
            1000
            -
            500
        )
        + "px";


    const inicioY =

        (
            Math.random() *
            800
            -
            400
        )
        + "px";


    corazon.style.setProperty(
        "--inicio-x",
        inicioX
    );


    corazon.style.setProperty(
        "--inicio-y",
        inicioY
    );


    /*
       Retraso aleatorio.
    */

    const delay =

        (
            Math.random() *
            5
        )
        + "s";


    corazon.style.setProperty(
        "--delay",
        delay
    );


    corazon.style.setProperty(
        "--duracion-flores",
        velocidadFlores + "s"
    );


    contenedorFlores.appendChild(
        corazon
    );
}


/* =========================================================
   💌 INSERTAR EL TÍTULO
   ========================================================= */

document.getElementById(
    "titulo"
).textContent =
    titulo;


/* =========================================================
   📝 INSERTAR LOS MENSAJES
   ========================================================= */

const contenedorTexto =
    document.getElementById(
        "texto"
    );


mensajes.forEach(
    function(frase) {

        const parrafo =
            document.createElement(
                "p"
            );


        parrafo.textContent =
            frase;


        contenedorTexto.appendChild(
            parrafo
        );

    }
);


/* =========================================================
   ❤️ CORAZONES ROSAS QUE FLOTAN
   =========================================================

   Estos siguen siendo independientes
   de los 50 🖤 del árbol.

   ========================================================= */

const numeroDeCorazones =
    12;


for (
    let i = 0;
    i < numeroDeCorazones;
    i++
) {

    const corazon =
        document.createElement(
            "div"
        );


    corazon.className =
        "corazon";


    corazon.textContent =
        "❤️";


    corazon.style.left =

        Math.random() *
        100
        + "%";


    corazon.style.bottom =
        "-30px";


    corazon.style.animationDelay =

        Math.random() *
        6
        + "s";


    document.body.appendChild(
        corazon
    );
}

</script>

</body>
</html>
